# Dapr Secrets Store Component - Local File (Development)
# T006: Create Dapr Secrets component
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: secrets-local
  namespace: default
spec:
  type: secretstores.local.file
  version: v1
  metadata:
    - name: secretsFile
      value: "/secrets/secrets.json"
    - name: nestedSeparator
      value: ":"
