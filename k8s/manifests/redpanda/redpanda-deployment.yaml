# Redpanda Single-Node Deployment for Development
# T002: Deploy Redpanda single-node cluster
# Note: For production, use Redpanda Helm chart with multiple replicas
apiVersion: v1
kind: Namespace
metadata:
  name: redpanda
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redpanda
  namespace: redpanda
spec:
  serviceName: redpanda
  replicas: 1
  selector:
    matchLabels:
      app: redpanda
  template:
    metadata:
      labels:
        app: redpanda
    spec:
      containers:
        - name: redpanda
          image: redpandadata/redpanda:latest
          args:
            - redpanda
            - start
            - --smp=1
            - --memory=512M
            - --reserve-memory=0M
            - --overprovisioned
            - --node-id=0
            - --check=false
            - --kafka-addr=PLAINTEXT://0.0.0.0:9092,OUTSIDE://0.0.0.0:9093
            - --advertise-kafka-addr=PLAINTEXT://redpanda.redpanda.svc.cluster.local:9092,OUTSIDE://redpanda.redpanda.svc.cluster.local:9093
          ports:
            - containerPort: 9092
              name: kafka-internal
            - containerPort: 9093
              name: kafka-external
            - containerPort: 8081
              name: schema-registry
            - containerPort: 8082
              name: http-proxy
            - containerPort: 9644
              name: admin
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          volumeMounts:
            - name: datadir
              mountPath: /var/lib/redpanda/data
  volumeClaimTemplates:
    - metadata:
        name: datadir
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: redpanda
  namespace: redpanda
spec:
  selector:
    app: redpanda
  ports:
    - port: 9092
      targetPort: 9092
      name: kafka-internal
    - port: 9093
      targetPort: 9093
      name: kafka-external
    - port: 8081
      targetPort: 8081
      name: schema-registry
    - port: 8082
      targetPort: 8082
      name: http-proxy
    - port: 9644
      targetPort: 9644
      name: admin
  clusterIP: None
