# T053: K8s deployment with Dapr annotations for realtime-sync-service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: realtime-sync-service
  labels:
    app: realtime-sync-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: realtime-sync-service
  template:
    metadata:
      labels:
        app: realtime-sync-service
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: "realtime-sync-service"
        dapr.io/app-port: "8002"
        dapr.io/enable-api-logging: "true"
    spec:
      containers:
        - name: realtime-sync-service
          image: realtime-sync-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8002
          env:
            - name: PORT
              value: "8002"
            - name: DAPR_HTTP_PORT
              value: "3500"
            - name: DAPR_PUBSUB_NAME
              value: "pubsub-redpanda"
            - name: DAPR_STATESTORE_NAME
              value: "statestore-redis"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: todo-secrets
                  key: jwt-secret
                  optional: true
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: realtime-sync-service
  labels:
    app: realtime-sync-service
spec:
  selector:
    app: realtime-sync-service
  ports:
    - port: 80
      targetPort: 8002
      protocol: TCP
  type: ClusterIP
