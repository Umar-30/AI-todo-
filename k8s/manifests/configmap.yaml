apiVersion: v1
kind: ConfigMap
metadata:
  name: todo-config
  labels:
    app.kubernetes.io/name: todo-chatbot
    app.kubernetes.io/component: config
data:
  # Backend configuration
  API_BASE_URL: "http://todo-backend-svc:8000"
  LOG_LEVEL: "INFO"
  ENVIRONMENT: "development"

  # Frontend configuration (used by nginx proxy)
  BACKEND_HOST: "todo-backend-svc"
  BACKEND_PORT: "8000"
