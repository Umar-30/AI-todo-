# T070: K8s deployment with Dapr annotations for reminder-service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reminder-service
  labels:
    app: reminder-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reminder-service
  template:
    metadata:
      labels:
        app: reminder-service
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: "reminder-service"
        dapr.io/app-port: "8003"
        dapr.io/enable-api-logging: "true"
    spec:
      containers:
        - name: reminder-service
          image: reminder-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8003
          env:
            - name: PORT
              value: "8003"
            - name: DAPR_HTTP_PORT
              value: "3500"
            - name: DAPR_PUBSUB_NAME
              value: "pubsub-redpanda"
            - name: DAPR_STATESTORE_NAME
              value: "statestore-redis"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: reminder-service
  labels:
    app: reminder-service
spec:
  selector:
    app: reminder-service
  ports:
    - port: 80
      targetPort: 8003
      protocol: TCP
  type: ClusterIP
