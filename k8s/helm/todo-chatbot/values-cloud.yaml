# Cloud (DOKS/Managed K8s) environment overrides
# Usage: helm upgrade --install todo-chatbot . -f values.yaml -f values-cloud.yaml

# GHCR images - update with your GitHub org/user
backend:
  image:
    repository: ghcr.io/umar-30/todo-backend
    tag: latest
    pullPolicy: Always
  replicas: 1

frontend:
  image:
    repository: ghcr.io/umar-30/todo-frontend
    tag: latest
    pullPolicy: Always
  replicas: 1
  port: 3000
  nodePort: 30080

recurringTask:
  image:
    repository: ghcr.io/umar-30/recurring-task-service
    tag: latest
    pullPolicy: Always
  replicas: 1

realtimeSync:
  image:
    repository: ghcr.io/umar-30/realtime-sync-service
    tag: latest
    pullPolicy: Always
  replicas: 1

reminder:
  image:
    repository: ghcr.io/umar-30/reminder-service
    tag: latest
    pullPolicy: Always
  replicas: 1

audit:
  image:
    repository: ghcr.io/umar-30/audit-service
    tag: latest
    pullPolicy: Always
  replicas: 1

# Dapr: In-cluster Redpanda + Redis (upgrade to managed later)
dapr:
  pubsub:
    name: pubsub-redpanda
    type: pubsub.kafka
    brokers: "redpanda.redpanda.svc.cluster.local:9093"
    consumerGroup: "todo-chatbot"
    authRequired: false
  statestore:
    name: statestore-redis
    type: state.redis
    host: "redis.redis.svc.cluster.local:6379"
    password: ""
    actorStateStore: true

# Infrastructure enabled - deploy Redis + Redpanda in cluster
infrastructure:
  redis:
    enabled: true
    image: redis:7-alpine
    port: 6379
  redpanda:
    enabled: true
    image: redpandadata/redpanda:latest
    kafkaPort: 9092
    internalPort: 9093

imagePullSecrets:
  - name: ghcr-secret

ingress:
  enabled: true
  host: "143-244-215-56.sslip.io"
  sseSupport: true

config:
  logLevel: "INFO"
  environment: "production"
  apiBaseUrl: "http://todo-backend-svc:8000"
