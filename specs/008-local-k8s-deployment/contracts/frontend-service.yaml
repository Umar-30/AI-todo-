# Frontend Service Specification
# This is a SPECIFICATION - actual implementation will be in k8s/manifests/
apiVersion: v1
kind: Service
metadata:
  name: todo-frontend-svc
  labels:
    app.kubernetes.io/name: todo-chatbot
    app.kubernetes.io/component: frontend
spec:
  type: NodePort  # External access via Minikube
  selector:
    app: todo-frontend
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      nodePort: 30080  # Configurable: 30000-32767
      protocol: TCP
